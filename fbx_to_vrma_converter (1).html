<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FBX to VRMA Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@2.0.0/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 md:p-8 border border-slate-700">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-full mb-3">
        <i class="fa-solid fa-running text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">FBX ➔ VRMA コンバーター</h1>
      <p class="text-slate-400 text-sm mt-1">FBXファイルからモーションデータのみを抽出してVRMAへ変換します</p>
    </div>

    <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-800/50 hover:bg-indigo-950/20 rounded-lg p-8 text-center cursor-pointer transition-all duration-200 group">
      <input type="file" id="fileInput" accept=".fbx" class="hidden" />
      <i class="fa-solid fa-file-arrow-up text-4xl text-slate-500 group-hover:text-indigo-400 mb-3 transition-colors"></i>
      <p class="text-slate-300 font-medium">ここにFBXファイルをドロップ</p>
      <p class="text-slate-500 text-xs mt-1">またはクリックしてファイルを選択</p>
    </div>

    <button id="convertBtn" disabled class="w-full mt-6 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-medium rounded-lg transition-colors flex items-center justify-center space-x-2 disabled:cursor-not-allowed">
      <i class="fa-solid fa-download"></i>
      <span>VRMAファイルを出力</span>
    </button>

    <div id="statusContainer" class="mt-4 p-4 rounded-lg bg-slate-900/50 border border-slate-700 hidden">
      <div class="flex items-start space-x-3">
        <div id="statusIcon" class="mt-0.5 text-indigo-400">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        </div>
        <div class="flex-1">
          <p id="statusTitle" class="text-sm font-semibold text-slate-200">処理中...</p>
          <pre id="statusDetails" class="text-xs text-slate-400 mt-1 whitespace-pre-wrap font-mono"></pre>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { VRMAnimationBuilder } from '@pixiv/three-vrm-animation';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const statusContainer = document.getElementById('statusContainer');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDetails = document.getElementById('statusDetails');

    let loadedFbx = null;

    const boneMapping = {
      'mixamorigHips': 'hips',
      'mixamorigSpine': 'spine',
      'mixamorigSpine1': 'chest',
      'mixamorigSpine2': 'upperChest',
      'mixamorigNeck': 'neck',
      'mixamorigHead': 'head',
      'mixamorigLeftShoulder': 'leftShoulder',
      'mixamorigLeftArm': 'leftUpperArm',
      'mixamorigLeftForeArm': 'leftLowerArm',
      'mixamorigLeftHand': 'leftHand',
      'mixamorigRightShoulder': 'rightShoulder',
      'mixamorigRightArm': 'rightUpperArm',
      'mixamorigRightForeArm': 'rightLowerArm',
      'mixamorigRightHand': 'rightHand',
      'mixamorigLeftUpLeg': 'leftUpperLeg',
      'mixamorigLeftLeg': 'leftLowerLeg',
      'mixamorigLeftFoot': 'leftFoot',
      'mixamorigLeftToeBase': 'leftToes',
      'mixamorigRightUpLeg': 'rightUpperLeg',
      'mixamorigRightLeg': 'rightLowerLeg',
      'mixamorigRightFoot': 'rightFoot',
      'mixamorigRightToeBase': 'rightToes'
    };

    dropZone.addEventListener('click', (e) => {
      // fileInput 自体のクリック時は再発火を防止
      if (e.target !== fileInput) {
        fileInput.click();
      }
    });

    fileInput.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('border-indigo-500', 'bg-indigo-950/20');
    });

    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-950/20');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-950/20');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function showStatus(type, title, details = '') {
      statusContainer.classList.remove('hidden');
      statusTitle.innerText = title;
      statusDetails.innerText = details;

      if (type === 'loading') {
        statusIcon.className = 'mt-0.5 text-indigo-400';
        statusIcon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
      } else if (type === 'success') {
        statusIcon.className = 'mt-0.5 text-emerald-400';
        statusIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      } else if (type === 'error') {
        statusIcon.className = 'mt-0.5 text-rose-400';
        statusIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
      }
    }

    function handleFile(file) {
      if (!file) return;

      if (!file.name.toLowerCase().endsWith('.fbx')) {
        showStatus('error', 'フォーマットエラー', 'FBXファイル（.fbx）を選択してください。');
        convertBtn.disabled = true;
        loadedFbx = null;
        fileInput.value = '';
        return;
      }

      showStatus('loading', 'ファイル解析中', 'FBXデータを読み込んでいます...');
      convertBtn.disabled = true;
      loadedFbx = null;

      // Blob URL を使用して FBXLoader でロード
      const blobUrl = URL.createObjectURL(file);
      const loader = new FBXLoader();

      loader.load(
        blobUrl,
        (fbxGroup) => {
          URL.revokeObjectURL(blobUrl);
          loadedFbx = fbxGroup;

          if (loadedFbx.animations && loadedFbx.animations.length > 0) {
            showStatus(
              'success', 
              '解析成功', 
              `ファイル名: ${file.name}\nアニメーション件数: ${loadedFbx.animations.length}件`
            );
            convertBtn.disabled = false;
          } else {
            showStatus('error', 'アニメーション未検出', '選択されたFBX内にキーフレームデータが存在しません。');
            convertBtn.disabled = true;
          }
          fileInput.value = '';
        },
        (progress) => {
          if (progress.lengthComputable) {
            const percent = Math.round((progress.loaded / progress.total) * 100);
            showStatus('loading', 'ファイル解析中', `読み込み進捗: ${percent}%`);
          }
        },
        (err) => {
          URL.revokeObjectURL(blobUrl);
          console.error(err);
          showStatus('error', '解析エラー', `FBXのロードに失敗しました。\n${err.message || err}`);
          convertBtn.disabled = true;
          fileInput.value = '';
        }
      );
    }

    convertBtn.addEventListener('click', async () => {
      if (!loadedFbx || !loadedFbx.animations || !loadedFbx.animations.length) return;

      showStatus('loading', 'VRMA生成中', 'モーションデータをVRM規格構造にマッピングしています...');
      
      try {
        const clip = loadedFbx.animations[0];
        const builder = new VRMAnimationBuilder();
        
        clip.tracks.forEach(track => {
          const trackNameParts = track.name.split('.');
          const rawBoneName = trackNameParts[0].replace('mixamorig:', 'mixamorig'); 
          const propertyName = trackNameParts[1];

          const humanoidBoneName = boneMapping[rawBoneName];

          if (humanoidBoneName) {
            if (propertyName === 'quaternion') {
              builder.addNodeTrack(humanoidBoneName, 'rotation', track);
            } else if (propertyName === 'position' && humanoidBoneName === 'hips') {
              builder.addNodeTrack(humanoidBoneName, 'translation', track);
            }
          }
        });

        const vrmAnimation = builder.build();

        const exporter = new GLTFExporter();
        exporter.parse(
          vrmAnimation.scene,
          (gltf) => {
            const blob = new Blob([gltf], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'motion.vrma';
            a.click();
            URL.revokeObjectURL(url);
            showStatus('success', '出力完了', 'VRMAファイル（motion.vrma）を出力・保存しました。');
          },
          (error) => {
            console.error(error);
            showStatus('error', 'エクスポートエラー', 'GLTF/VRMAのエクスポート処理に失敗しました。');
          },
          { binary: true }
        );

      } catch (err) {
        console.error(err);
        showStatus('error', '変換エラー', `VRMA変換中にエラーが発生しました。\n${err.message}`);
      }
    });
  </script>
</body>
</html>
